name: Deploy Python Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/hubbackend
            git pull origin main

            # Virtual environment (venv) မရှိသေးပါက တည်ဆောက်ခြင်း
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Package များ install လုပ်ခြင်း
            source venv/bin/activate
            if [ -f "requirements.txt" ]; then
              pip install --upgrade pip
              pip install -r requirements.txt
            fi

            # PM2 ဖြင့် Python app ကို စတင် run/restart လုပ်ခြင်း
            pm2 restart backend || pm2 start main.py --name "backend" --interpreter python3
